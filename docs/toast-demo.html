<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toast Demo</title>
  <link rel="stylesheet" href="../src/styles/tokens.css" />
  <link rel="stylesheet" href="../src/components/toast/toast.css" />
  <style>
    body {
      margin: 0;
      padding: var(--space-xl);
      background: var(--color-bg);
      color: var(--color-text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    h1 {
      font-size: 1.5rem;
    }

    .container {
      max-width: 640px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      margin: var(--space-md) 0;
    }

    label {
      display: block;
      margin-top: var(--space-md);
      font-size: var(--font-size-sm);
      font-weight: 600;
    }

    select {
      margin-top: var(--space-xs);
      padding: var(--space-sm);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font: inherit;
    }

    button {
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      color: var(--color-text);
      font: inherit;
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    button:hover {
      background: var(--color-border);
    }

    button.primary {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    button.primary:hover {
      background: var(--color-primary-hover);
    }

    .log {
      margin-top: var(--space-lg);
      padding: var(--space-md);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: ui-monospace, monospace;
      font-size: var(--font-size-sm);
      min-height: 4em;
      max-height: 16em;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Toast 컴포넌트 데모</h1>
    <p>
      Toast는 기존 요소에 붙는 대신 스스로 컨테이너를 만들어 body에 삽입하는 매니저 패턴입니다.
      아래 위치를 바꿔가며 버튼을 눌러보세요. maxVisible(3)을 넘는 토스트는 큐에 대기했다가
      기존 토스트가 사라질 때마다 순서대로 표시됩니다.
    </p>

    <label for="positionSelect">position</label>
    <select id="positionSelect">
      <option value="top-right" selected>top-right</option>
      <option value="top-left">top-left</option>
      <option value="top-center">top-center</option>
      <option value="bottom-right">bottom-right</option>
      <option value="bottom-left">bottom-left</option>
      <option value="bottom-center">bottom-center</option>
    </select>

    <div class="controls">
      <button id="btnSuccess" class="primary">성공 토스트 띄우기</button>
      <button id="btnError">오류 토스트 띄우기</button>
      <button id="btnBurst">여러 개 한번에 띄워서 큐 확인하기</button>
      <button id="btnPersistent">수동 dismiss 토스트 (duration: 0)</button>
      <button id="btnClear">clear() 전부 지우기</button>
    </div>

    <div class="log" id="eventLog">이벤트 로그가 여기에 표시됩니다.</div>
  </div>

  <script type="module">
    import Toast from '../src/components/toast/toast.js';

    const logEl = document.getElementById('eventLog');
    function log(message) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent = `[${time}] ${message}\n` + logEl.textContent;
    }

    let toast = new Toast({ position: 'top-right', duration: 3000, maxVisible: 3 });

    function bindEvents() {
      toast.el.addEventListener('toast:show', (e) => log(`toast:show — id: ${e.detail.id}`));
      toast.el.addEventListener('toast:dismiss', (e) => log(`toast:dismiss — id: ${e.detail.id}`));
    }
    bindEvents();

    document.getElementById('positionSelect').addEventListener('change', (e) => {
      const position = e.target.value;
      toast.destroy();
      toast = new Toast({ position, duration: 3000, maxVisible: 3 });
      bindEvents();
      log(`컨테이너 위치를 ${position}(으)로 변경`);
    });

    document.getElementById('btnSuccess').addEventListener('click', () => {
      toast.show('저장되었습니다.', { type: 'success' });
    });

    document.getElementById('btnError').addEventListener('click', () => {
      toast.show('오류가 발생했습니다. 다시 시도해주세요.', { type: 'error' });
    });

    document.getElementById('btnBurst').addEventListener('click', () => {
      const messages = [
        { message: '첫 번째 알림', type: 'info' },
        { message: '두 번째 알림', type: 'success' },
        { message: '세 번째 알림', type: 'warning' },
        { message: '네 번째 알림 (큐 대기)', type: 'error' },
        { message: '다섯 번째 알림 (큐 대기)', type: 'info' },
      ];
      messages.forEach(({ message, type }) => toast.show(message, { type }));
      log('5개 토스트 요청 — maxVisible(3) 초과분은 큐에서 대기 후 순서대로 표시됩니다.');
    });

    let persistentId = null;
    document.getElementById('btnPersistent').addEventListener('click', () => {
      if (persistentId) {
        toast.dismiss(persistentId);
        persistentId = null;
        return;
      }
      persistentId = toast.show('처리 중입니다...', { type: 'info', duration: 0 });
      log(`수동 dismiss 토스트 생성 — id: ${persistentId} (버튼을 다시 누르면 dismiss)`);
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      toast.clear();
      persistentId = null;
      log('clear() 호출 — 보이는 토스트 + 큐 전부 제거');
    });

    window.__toast = toast;
  </script>
</body>
</html>
