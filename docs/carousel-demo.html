<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carousel Demo</title>
  <link rel="stylesheet" href="../src/styles/tokens.css" />
  <link rel="stylesheet" href="../src/components/carousel/carousel.css" />
  <style>
    body {
      margin: 0;
      padding: var(--space-xl);
      background: var(--color-bg);
      color: var(--color-text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    h1 {
      font-size: 1.5rem;
    }

    .container {
      max-width: 640px;
    }

    .carousel-slide {
      color: #ffffff;
    }

    .carousel-slide:nth-child(1) { background: #4f46e5; }
    .carousel-slide:nth-child(2) { background: #0891b2; }
    .carousel-slide:nth-child(3) { background: #16a34a; }
    .carousel-slide:nth-child(4) { background: #d97706; }
    .carousel-slide:nth-child(5) { background: #dc2626; }

    .controls {
      display: flex;
      gap: var(--space-sm);
      margin-top: var(--space-md);
    }

    .controls button {
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg);
      color: var(--color-text);
      font: inherit;
      font-size: var(--font-size-sm);
      cursor: pointer;
    }

    .controls button:hover {
      background: var(--color-surface);
    }

    .log {
      margin-top: var(--space-lg);
      padding: var(--space-md);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: ui-monospace, monospace;
      font-size: var(--font-size-sm);
      min-height: 4em;
      max-height: 12em;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Carousel 컴포넌트 데모</h1>
    <p>
      ‹/› 버튼, 하단 점(인디케이터) 클릭, 또는 좌우 드래그/스와이프(마우스·터치 50px 이상)로 슬라이드를
      전환해보세요. 슬라이드 위에 마우스를 올리거나 드래그하는 동안에는 자동재생이 일시 정지됩니다.
    </p>

    <div id="myCarousel" class="carousel">
      <div class="carousel-track">
        <div class="carousel-slide">슬라이드 1</div>
        <div class="carousel-slide">슬라이드 2</div>
        <div class="carousel-slide">슬라이드 3</div>
        <div class="carousel-slide">슬라이드 4</div>
        <div class="carousel-slide">슬라이드 5</div>
      </div>
      <button class="carousel-prev" aria-label="이전 슬라이드">‹</button>
      <button class="carousel-next" aria-label="다음 슬라이드">›</button>
      <div class="carousel-indicators"></div>
    </div>

    <div class="controls">
      <button id="playBtn" type="button">play()</button>
      <button id="pauseBtn" type="button">pause()</button>
    </div>

    <div class="log" id="eventLog">이벤트 로그가 여기에 표시됩니다.</div>
  </div>

  <script type="module">
    import Carousel from '../src/components/carousel/carousel.js';

    const logEl = document.getElementById('eventLog');
    function log(message) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent = `[${time}] ${message}\n` + logEl.textContent;
    }

    const carousel = new Carousel('#myCarousel', {
      autoplay: true,
      interval: 3000,
      loop: true,
      startIndex: 0,
      onChange: ({ index }) => {
        log(`onChange 콜백 — index: ${index}`);
      },
    });

    document.getElementById('myCarousel').addEventListener('carousel:change', (e) => {
      log(`carousel:change 커스텀 이벤트 — index: ${e.detail.index}`);
    });

    document.getElementById('playBtn').addEventListener('click', () => carousel.play({ immediate: true }));
    document.getElementById('pauseBtn').addEventListener('click', () => carousel.pause());

    window.__carousel = carousel;
  </script>
</body>
</html>
