<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dropdown Demo</title>
  <link rel="stylesheet" href="../src/styles/tokens.css" />
  <link rel="stylesheet" href="../src/components/dropdown/dropdown.css" />
  <style>
    body {
      margin: 0;
      padding: var(--space-xl);
      background: var(--color-bg);
      color: var(--color-text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    h1 {
      font-size: 1.5rem;
    }

    .container {
      max-width: 640px;
    }

    .log {
      margin-top: var(--space-lg);
      padding: var(--space-md);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: ui-monospace, monospace;
      font-size: var(--font-size-sm);
      min-height: 4em;
      max-height: 12em;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dropdown 컴포넌트 데모</h1>
    <p>
      트리거 버튼에 포커스를 준 뒤 Enter/Space/↓로 목록을 열고, ↑/↓(순환), Home/End로
      하이라이트를 이동해보세요. Enter/Space로 선택, Escape로 선택 없이 닫을 수 있습니다.
      목록 바깥을 클릭해도 닫힙니다.
    </p>

    <div id="myDropdown" class="dropdown">
      <button class="dropdown-trigger" aria-haspopup="listbox" aria-expanded="false" id="dropdown-btn">선택하세요</button>
      <ul class="dropdown-list" role="listbox" aria-labelledby="dropdown-btn" hidden></ul>
    </div>

    <div class="log" id="eventLog">이벤트 로그가 여기에 표시됩니다.</div>
  </div>

  <script type="module">
    import Dropdown from '../src/components/dropdown/dropdown.js';

    const logEl = document.getElementById('eventLog');
    function log(message) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent = `[${time}] ${message}\n` + logEl.textContent;
    }

    const dropdown = new Dropdown('#myDropdown', {
      placeholder: '과일을 선택하세요',
      options: [
        { value: 'apple', label: '사과' },
        { value: 'banana', label: '바나나' },
        { value: 'grape', label: '포도' },
        { value: 'orange', label: '오렌지' },
        { value: 'peach', label: '복숭아' },
        { value: 'watermelon', label: '수박' },
      ],
      onSelect: ({ value, label }) => {
        log(`onSelect 콜백 — value: ${value}, label: ${label}`);
      },
    });

    document.getElementById('myDropdown').addEventListener('dropdown:select', (e) => {
      log(`dropdown:select 커스텀 이벤트 — value: ${e.detail.value}, label: ${e.detail.label}`);
    });
    document.getElementById('myDropdown').addEventListener('dropdown:open', () => {
      log('dropdown:open 커스텀 이벤트');
    });
    document.getElementById('myDropdown').addEventListener('dropdown:close', () => {
      log('dropdown:close 커스텀 이벤트');
    });

    window.__dropdown = dropdown;
  </script>
</body>
</html>
