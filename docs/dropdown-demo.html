<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dropdown Demo</title>
  <link rel="stylesheet" href="../src/styles/tokens.css" />
  <link rel="stylesheet" href="../src/components/dropdown/dropdown.css" />
  <style>
    body {
      margin: 0;
      padding: var(--space-xl);
      background: var(--color-bg);
      color: var(--color-text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    h1 {
      font-size: 1.5rem;
    }

    .container {
      max-width: 640px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dropdown 컴포넌트 데모</h1>
    <p>
      트리거를 클릭하거나 포커스 후 Enter/Space/방향키(↓)로 열어보세요. 열린 상태에서는
      ↑/↓(순환), Home/End로 하이라이트를 옮기고, Enter/Space로 선택, Escape로 취소할 수 있습니다.
      목록 바깥을 클릭해도 닫힙니다.
    </p>

    <div id="myDropdown" class="dropdown">
      <button
        class="dropdown-trigger"
        aria-haspopup="listbox"
        aria-expanded="false"
        id="dropdown-btn"
      >
        선택하세요
      </button>
      <ul class="dropdown-list" role="listbox" aria-labelledby="dropdown-btn" hidden></ul>
    </div>
  </div>

  <script type="module">
    import Dropdown from '../src/components/dropdown/dropdown.js';

    const dropdown = new Dropdown('#myDropdown', {
      options: [
        { value: 'apple', label: '사과' },
        { value: 'banana', label: '바나나' },
        { value: 'grape', label: '포도' },
        { value: 'orange', label: '오렌지' },
        { value: 'peach', label: '복숭아' },
        { value: 'watermelon', label: '수박' },
      ],
      placeholder: '과일을 선택하세요',
    });

    window.__dropdown = dropdown;
  </script>
</body>
</html>
