<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal Demo</title>
  <link rel="stylesheet" href="../src/styles/tokens.css" />
  <link rel="stylesheet" href="../src/components/modal/modal.css" />
  <style>
    body {
      margin: 0;
      padding: var(--space-xl);
      background: var(--color-bg);
      color: var(--color-text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    h1 {
      font-size: 1.5rem;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .btn {
      display: inline-block;
      padding: var(--space-sm) var(--space-md);
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--font-size-md);
      transition: background var(--transition-fast);
    }

    .btn:hover {
      background: var(--color-primary-hover);
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    .btn-secondary:hover {
      background: var(--color-border);
    }
  </style>
</head>
<body>
  <h1>Modal 컴포넌트 데모</h1>
  <p>버튼을 눌러 모달을 열어보세요. ESC, 오버레이 클릭, Tab 포커스 트랩, 배경 스크롤 락, 이전 포커스 복귀를 테스트할 수 있습니다.</p>

  <button type="button" class="btn" id="openModalBtn">모달 열기</button>

  <!-- 모달 마크업: 루트(#demoModal) 자체가 오버레이, 내부 .modal-content가 다이얼로그 -->
  <div id="demoModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="demoModalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="demoModalTitle">샘플 모달</h2>
        <button type="button" class="modal-close" id="modalCloseBtn" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <p>이 모달은 다음 기능을 지원합니다:</p>
        <ul>
          <li>ESC 키로 닫기</li>
          <li>오버레이(배경) 클릭으로 닫기 — 이 박스를 클릭해도 닫히지 않음</li>
          <li>Tab / Shift+Tab 포커스 트랩</li>
          <li>배경 스크롤 락</li>
          <li>닫을 때 이전 포커스 요소로 복귀</li>
        </ul>
        <label>
          포커스 트랩 테스트용 입력:
          <input type="text" placeholder="여기에 입력해보세요" />
        </label>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="modalCancelBtn">취소</button>
        <button type="button" class="btn" id="modalConfirmBtn">확인</button>
      </div>
    </div>
  </div>

  <script type="module">
    import Modal from '../src/components/modal/modal.js';

    const modal = new Modal('#demoModal', {
      closeOnEsc: true,
      closeOnOverlayClick: true,
    });

    document.getElementById('openModalBtn').addEventListener('click', () => modal.open());
    document.getElementById('modalCloseBtn').addEventListener('click', () => modal.close());
    document.getElementById('modalCancelBtn').addEventListener('click', () => modal.close());
    document.getElementById('modalConfirmBtn').addEventListener('click', () => modal.close());

    // 중복 open() 호출 방지 테스트용 — 콘솔에서 window.__modal.open()을 여러 번 호출해봐도 안전함
    window.__modal = modal;
  </script>
</body>
</html>
